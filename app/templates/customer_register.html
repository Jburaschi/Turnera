{% extends 'base.html' %}
{% block title %}Registro cliente{% endblock %}
{% block topnav %}{% endblock %}
{% block content %}
<div class="container py-5"><div class="card shadow-sm mx-auto" style="max-width:600px"><div class="card-body p-4">
<h1 class="h4 mb-3">Crear cuenta en {{ company.name }}</h1>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="row g-3">
<div class="col-12"><label class="form-label">Nombre completo</label><input class="form-control" name="full_name" required></div>
<div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
<div class="col-md-6"><label class="form-label">Teléfono</label><input class="form-control" name="phone"></div>
<div class="col-md-6"><label class="form-label">DNI</label><input class="form-control" name="dni"></div>
<div class="col-md-6"><label class="form-label">Clave</label><input class="form-control" type="password" name="password" required></div>
</div>
<button class="btn btn-dark w-100 mt-4">Registrarme</button>
</form>
</div></div></div>
{% endblock %}
